<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad-pixel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181e"/>
      <stop offset="100%" stop-color="#0e1115"/>
    </linearGradient>
    <pattern id="dot-grid-pixel" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9bcbb1" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-pixel)"/>
  <rect width="800" height="450" fill="url(#dot-grid-pixel)"/>

  <!-- Top bar / Architecture Badge -->
  <rect x="32" y="24" width="240" height="28" rx="14" fill="#1e242c" stroke="#9bcbb1" stroke-opacity="0.25"/>
  <circle cx="48" cy="38" r="4" fill="#9bcbb1"/>
  <text x="60" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#9bcbb1" letter-spacing="0.1em">EVENT-DRIVEN BACKEND</text>

  <rect x="580" y="24" width="188" height="28" rx="14" fill="#1b2e25" stroke="#9bcbb1" stroke-opacity="0.4"/>
  <text x="674" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#9bcbb1">HACKATHON DEPLOY</text>

  <!-- Node 1: Arcade Game Client -->
  <g transform="translate(48, 110)">
    <rect width="190" height="230" rx="12" fill="#181d24" stroke="rgba(210,217,226,0.12)" stroke-width="1.5"/>
    <rect x="16" y="16" width="60" height="22" rx="4" fill="#202732"/>
    <text x="46" y="31" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#959eac">CLIENT</text>
    <text x="16" y="66" font-family="'DM Sans', sans-serif" font-size="17" font-weight="700" fill="#eceef3">Arcade Frontend</text>
    <text x="16" y="86" font-family="'DM Sans', sans-serif" font-size="13" fill="#959eac">Real-Time Quiz UI</text>

    <g transform="translate(16, 110)">
      <rect width="158" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">Next.js Game Loop</text>
    </g>
    <g transform="translate(16, 154)">
      <rect width="158" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">WebSockets Sync</text>
    </g>
  </g>

  <!-- Flow Arrows (Bidirectional) -->
  <path d="M246 215 L306 215" stroke="#9bcbb1" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="310,215 302,210 302,220" fill="#9bcbb1"/>
  <path d="M306 235 L246 235" stroke="#9bcbb1" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="242,235 250,230 250,240" fill="#9bcbb1"/>

  <!-- Node 2: Event-Driven Backend -->
  <g transform="translate(318, 95)">
    <rect width="204" height="260" rx="12" fill="#1a222b" stroke="#9bcbb1" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="16" y="16" width="90" height="22" rx="4" fill="#1b3329"/>
    <text x="61" y="31" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#9bcbb1">BACKEND LEAD</text>
    <text x="16" y="66" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700" fill="#eceef3">Event Engine</text>
    <text x="16" y="86" font-family="'DM Sans', sans-serif" font-size="13" fill="#959eac">Serverless Orchestration</text>

    <g transform="translate(16, 108)">
      <rect width="172" height="36" rx="6" fill="#12161b" stroke="#9bcbb1" stroke-opacity="0.2"/>
      <text x="12" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9bcbb1">Webflow Cloud Functions</text>
    </g>
    <g transform="translate(16, 154)">
      <rect width="172" height="36" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">State Validation Logic</text>
    </g>
    <g transform="translate(16, 200)">
      <rect width="172" height="36" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">Instant Leaderboard</text>
    </g>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <path d="M530 225 L570 225" stroke="#9bcbb1" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="574,225 566,220 566,230" fill="#9bcbb1"/>

  <!-- Node 3: CMS & Storage -->
  <g transform="translate(580, 110)">
    <rect width="172" height="230" rx="12" fill="#181d24" stroke="rgba(210,217,226,0.12)" stroke-width="1.5"/>
    <rect x="16" y="16" width="60" height="22" rx="4" fill="#202732"/>
    <text x="46" y="31" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#959eac">STORAGE</text>
    <text x="16" y="66" font-family="'DM Sans', sans-serif" font-size="17" font-weight="700" fill="#eceef3">Realtime CMS</text>
    <text x="16" y="86" font-family="'DM Sans', sans-serif" font-size="13" fill="#959eac">Webflow CMS API</text>

    <g transform="translate(16, 110)">
      <rect width="140" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">Trivia Store</text>
    </g>
    <g transform="translate(16, 154)">
      <rect width="140" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">Live Audit Log</text>
    </g>
  </g>

  <line x1="48" y1="380" x2="752" y2="380" stroke="rgba(210,217,226,0.08)"/>
  <text x="48" y="405" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6d7685">SHIPPED UNDER HACKATHON TIME CONSTRAINTS · ZERO-DOWNTIME JURY EVALUATION</text>
