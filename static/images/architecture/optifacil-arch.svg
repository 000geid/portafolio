<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad-opti" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181e"/>
      <stop offset="100%" stop-color="#0e1115"/>
    </linearGradient>
    <pattern id="dot-grid-opti" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9bcbb1" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-opti)"/>
  <rect width="800" height="450" fill="url(#dot-grid-opti)"/>

  <!-- Top bar / Architecture Badge -->
  <rect x="32" y="24" width="230" height="28" rx="14" fill="#1e242c" stroke="#9bcbb1" stroke-opacity="0.25"/>
  <circle cx="48" cy="38" r="4" fill="#9bcbb1"/>
  <text x="60" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#9bcbb1" letter-spacing="0.1em">TAURI + CLOUDFLARE EDGE</text>

  <rect x="616" y="24" width="152" height="28" rx="14" fill="#1b2e25" stroke="#9bcbb1" stroke-opacity="0.4"/>
  <text x="692" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#9bcbb1">LOCAL-FIRST · EDGE</text>

  <!-- Node 1: Desktop Application -->
  <g transform="translate(48, 110)">
    <rect width="210" height="230" rx="12" fill="#1a222b" stroke="#9bcbb1" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="16" y="16" width="92" height="22" rx="4" fill="#1b3329"/>
    <text x="62" y="31" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#9bcbb1">CLIENT LAYER</text>
    <text x="16" y="66" font-family="'DM Sans', sans-serif" font-size="17" font-weight="700" fill="#eceef3">Tauri Desktop</text>
    <text x="16" y="86" font-family="'DM Sans', sans-serif" font-size="13" fill="#959eac">Retail Point of Sale &amp; Stock</text>

    <g transform="translate(16, 110)">
      <rect width="178" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">Rust Native Core</text>
    </g>
    <g transform="translate(16, 154)">
      <rect width="178" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">React / TypeScript UI</text>
    </g>
  </g>

  <!-- Flow Arrows (Bidirectional Sync) -->
  <path d="M266 215 L324 215" stroke="#9bcbb1" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="328,215 320,210 320,220" fill="#9bcbb1"/>
  <path d="M324 235 L266 235" stroke="#9bcbb1" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="262,235 270,230 270,240" fill="#9bcbb1"/>

  <!-- Node 2: Hono Serverless API -->
  <g transform="translate(336, 110)">
    <rect width="180" height="230" rx="12" fill="#181d24" stroke="rgba(210,217,226,0.12)" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="22" rx="4" fill="#202732"/>
    <text x="51" y="31" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#959eac">API LAYER</text>
    <text x="16" y="66" font-family="'DM Sans', sans-serif" font-size="17" font-weight="700" fill="#eceef3">Hono Gateway</text>
    <text x="16" y="86" font-family="'DM Sans', sans-serif" font-size="13" fill="#959eac">Sub-millisecond Routing</text>

    <g transform="translate(16, 110)">
      <rect width="148" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">JWT Auth &amp; Tenant</text>
    </g>
    <g transform="translate(16, 154)">
      <rect width="148" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">Zod Schema Valid.</text>
    </g>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <path d="M524 225 L566 225" stroke="#9bcbb1" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="570,225 562,220 562,230" fill="#9bcbb1"/>

  <!-- Node 3: Cloudflare Edge Storage -->
  <g transform="translate(576, 110)">
    <rect width="176" height="230" rx="12" fill="#181d24" stroke="rgba(210,217,226,0.12)" stroke-width="1.5"/>
    <rect x="16" y="16" width="60" height="22" rx="4" fill="#202732"/>
    <text x="46" y="31" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#959eac">STORAGE</text>
    <text x="16" y="66" font-family="'DM Sans', sans-serif" font-size="17" font-weight="700" fill="#eceef3">Workers D1</text>
    <text x="16" y="86" font-family="'DM Sans', sans-serif" font-size="13" fill="#959eac">Global Replicated DB</text>

    <g transform="translate(16, 110)">
      <rect width="144" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">Cloudflare D1 SQL</text>
    </g>
    <g transform="translate(16, 154)">
      <rect width="144" height="34" rx="6" fill="#12161b" stroke="rgba(210,217,226,0.08)"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cfd5de">KV Cache &amp; Queues</text>
    </g>
  </g>

  <line x1="48" y1="380" x2="752" y2="380" stroke="rgba(210,217,226,0.08)"/>
  <text x="48" y="405" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6d7685">OFFLINE-FIRST SYNCHRONIZATION · SUB-50MS EDGE LATENCY · MINIMAL MEMORY FOOTPRINT</text>
</svg>
